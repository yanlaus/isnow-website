<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="腦力勇者" />
  <meta name="theme-color" content="#0b0f1c" />
  <meta name="format-detection" content="telephone=no" />
  <title>腦力勇者 — 長者動腦冒險遊戲</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="manifest" href="games.webmanifest" />
  <link rel="apple-touch-icon" href="games/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="games/icons/favicon-64.png" />
  <link rel="stylesheet" href="games.css" />
  <link rel="modulepreload" href="vendor/three/three.module.min.js" />
</head>
<body class="booting">

<canvas id="gl" aria-hidden="true"></canvas>

<div id="ui">

  <!-- ================= 主選單 ================= -->
  <section class="layer menu active" id="menu" aria-label="冒險據點">
    <header class="topbar">
      <a href="index.html" class="pill-btn" aria-label="返回 iSnow 主頁"><span data-icon="back"></span>iSnow</a>
      <div class="hero-chip" aria-live="polite">
        <div class="lv-ring"><small>Lv</small><b id="mLv">1</b></div>
        <div class="hero-meta">
          <div class="hero-title" id="mTitle">見習冒險者</div>
          <div class="exp-bar" aria-hidden="true"><i id="mExp"></i></div>
        </div>
      </div>
      <button class="round-btn mute-toggle" aria-label="關閉音效" aria-pressed="false"></button>
    </header>

    <div class="menu-body">
      <div class="menu-hero">
        <div class="logo">
          <p class="logo-kicker">BRAIN QUEST</p>
          <h1 class="logo-title">腦力勇者</h1>
          <p class="logo-rule" aria-hidden="true"><i></i><b></b><i></i></p>
          <p class="logo-sub">每日一戰，鍛鍊專注力與記憶力</p>
        </div>
        <div class="menu-stage" id="menuStage" aria-hidden="true"></div>
      </div>
      <div class="menu-list" id="menuList">
        <div class="tip-card frame" id="installTip" hidden>
          <span class="tip-ico" aria-hidden="true"><span data-icon="addbox"></span></span>
          <div class="tip-body">
            <b class="tip-title">加到主畫面，一撳就開</b>
            <p class="tip-text" id="installText"></p>
            <p class="tip-note" id="installNote"></p>
          </div>
          <div class="tip-actions">
            <button class="cta tip-install" data-action="install" hidden>安裝</button>
            <button class="ghost-btn tip-close" data-action="dismiss-install">知道了</button>
          </div>
        </div>
        <div id="gameGrid"></div>
        <button class="ghost-btn records-btn" data-action="records"><span data-icon="scroll"></span>冒險紀錄</button>
      </div>
    </div>
  </section>

  <!-- ================= 遊戲中 ================= -->
  <section class="layer game" id="game" aria-label="遊戲中">
    <header class="hud">
      <button class="pill-btn" data-action="retreat"><span data-icon="back"></span>撤退</button>
      <div class="timer-pill" aria-label="計時"><span class="t-ico" data-icon="hourglass"></span><span id="timer">0.0<small>秒</small></span></div>
      <div class="hud-right">
        <div class="pill counter" id="counter">失誤 <b>0</b></div>
        <button class="round-btn mute-toggle" aria-label="關閉音效" aria-pressed="false"></button>
      </div>
    </header>

    <!-- 數觸之戰：魔像區 + 石磚區 -->
    <div class="mode schulte-mode" data-mode="schulte">
      <div class="enemy-panel">
        <div class="enemy-plate">
          <span class="enemy-name" id="enemyName">魔像</span>
          <div class="hp-bar" aria-hidden="true"><i id="hpFill"></i></div>
        </div>
        <div class="enemy-stage" data-region="enemy"></div>
        <p class="toast" aria-live="polite"></p>
        <div class="next-chip" aria-live="polite"><small>下一個</small><b id="nextNum">1</b></div>
      </div>
      <div class="play" data-region="play"></div>
    </div>

    <!-- 格仔世界：迷宮、一筆畫（方向掣） -->
    <div class="mode grid-mode" data-mode="grid">
      <div class="play" data-region="play"></div>
      <div class="controls">
        <p class="toast" aria-live="polite"></p>
        <div class="dpad" role="group" aria-label="方向掣">
          <button class="dpad-btn up" data-dir="up" aria-label="向上"><span data-icon="up"></span></button>
          <button class="dpad-btn left" data-dir="left" aria-label="向左"><span data-icon="left"></span></button>
          <span class="dpad-hub" aria-hidden="true"><span data-icon="north"></span>北</span>
          <button class="dpad-btn right" data-dir="right" aria-label="向右"><span data-icon="right"></span></button>
          <button class="dpad-btn down" data-dir="down" aria-label="向下"><span data-icon="down"></span></button>
        </div>
        <div class="tool-row" hidden></div>
      </div>
    </div>

    <!-- 單一遊戲區：寶箱記憶、咒文連鎖、麻雀、打怪 -->
    <div class="mode board-mode" data-mode="board">
      <p class="toast" aria-live="polite"></p>
      <div class="play" data-region="play"></div>
      <div class="tool-row" hidden></div>
    </div>

    <!-- 場景 + 操作面板：道具店、成語石碑 -->
    <div class="mode panel-mode" data-mode="panel">
      <div class="panel-stage">
        <div class="stage-box" data-region="stage"></div>
        <p class="toast" aria-live="polite"></p>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </div>

    <div class="popups" id="popups" aria-hidden="true"></div>
  </section>

  <!-- 必殺技插畫橫幅 -->
  <div class="cutin" id="cutin" aria-live="assertive" hidden>
    <div class="cutin-band">
      <span class="cutin-name" id="cutinName">勇者</span>
      <span class="cutin-attack" id="cutinAttack">必殺・流星斬！</span>
    </div>
  </div>

  <!-- ================= 難度選擇 ================= -->
  <div class="overlay" id="diffOverlay" role="dialog" aria-modal="true" aria-labelledby="diffTitle" hidden>
    <div class="panel diff-panel">
      <h2 class="panel-title" id="diffTitle">數觸之戰</h2>
      <p class="panel-sub" id="diffSub"></p>
      <div class="level-grid" id="levelGrid"></div>
      <button class="ghost-btn" data-action="close-diff">返回</button>
    </div>
  </div>

  <!-- ================= 冒險紀錄 ================= -->
  <div class="overlay" id="recordsOverlay" role="dialog" aria-modal="true" aria-labelledby="recTitle" hidden>
    <div class="panel records-panel">
      <h2 class="panel-title" id="recTitle"><span data-icon="scroll"></span>冒險紀錄</h2>
      <div class="rec-hero">
        <div class="lv-ring big"><small>Lv</small><b id="rLv">1</b></div>
        <div class="rec-hero-info">
          <div class="rec-title" id="rTitle">見習冒險者</div>
          <div class="exp-bar big" aria-hidden="true"><i id="rExp"></i></div>
          <div class="rec-exp" id="rExpText"></div>
        </div>
      </div>
      <div class="rec-list" id="recList"></div>
      <button class="cta" data-action="close-records">好</button>
    </div>
  </div>

  <!-- ================= 開場倒數 ================= -->
  <div class="countdown" id="countdown" aria-live="assertive" hidden>
    <div class="cd-intro" id="cdIntro"></div>
    <div class="cd-num" id="cdNum"></div>
  </div>

  <!-- ================= 戰果 ================= -->
  <div class="overlay" id="resultOverlay" role="dialog" aria-modal="true" aria-labelledby="resTitle" hidden>
    <div class="panel result-panel">
      <div class="res-main">
        <p class="res-kicker" id="resKicker">VICTORY</p>
        <h2 class="res-title" id="resTitle">勝利！</h2>
        <div class="res-stars" id="resStars"></div>
        <div class="res-time"><span id="resLabel">用時</span><b id="resTime">0.0</b></div>
        <p class="res-note">
          <span class="res-badge" id="resBadge" hidden></span>
          <span class="res-compare" id="resCompare" hidden></span>
        </p>
      </div>
      <div class="res-side">
        <ul class="res-stats" id="resStats"></ul>
        <p class="res-exp" id="resExp"></p>
        <p class="res-unlock" id="resUnlock" hidden><span data-icon="unlock"></span>魔王級已解鎖</p>
        <div class="levelup" id="resLevelUp" hidden>
          <b>等級提升！</b><span id="resLevelDetail"></span>
        </div>
        <div class="res-actions">
          <button class="cta" data-action="again"><span data-icon="play"></span>再戰一次</button>
          <button class="ghost-btn" data-action="change-diff">轉難度</button>
          <button class="ghost-btn" data-action="home">返回據點</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= 撤退確認 ================= -->
  <div class="overlay" id="retreatOverlay" role="dialog" aria-modal="true" aria-labelledby="retreatTitle" hidden>
    <div class="panel small">
      <h2 class="panel-title" id="retreatTitle">要撤退嗎？</h2>
      <p class="panel-sub">今次戰鬥的進度不會保存。</p>
      <div class="stack">
        <button class="cta" data-action="retreat-no">繼續戰鬥</button>
        <button class="ghost-btn" data-action="retreat-yes">撤退，返回據點</button>
      </div>
    </div>
  </div>

  <!-- ================= 載入中／不支援 ================= -->
  <div class="boot" id="boot">
    <div class="boot-inner">
      <div class="boot-kicker">BRAIN QUEST</div>
      <div class="boot-title">腦力勇者</div>
      <div class="boot-msg" id="bootMsg">冒險準備中……</div>
    </div>
  </div>
</div>

<script type="module" src="games/main.js"></script>
<script nomodule>
  document.getElementById('bootMsg').innerHTML = '你部機暫時未能顯示 3D 畫面。<br>請更新 iOS／iPadOS，或者用較新嘅瀏覽器再試。';
</script>
<script>
  // 網絡慢或者載入失敗時，唔好停喺「準備中」
  setTimeout(function () {
    if (document.body.classList.contains('booting')) {
      var m = document.getElementById('bootMsg');
      if (m && m.textContent.indexOf('準備中') >= 0) m.innerHTML = '仲載入緊……<br>如果太耐，請重新整理頁面。';
    }
  }, 12000);
</script>
<noscript><p style="color:#fff;padding:24px">請開啟 JavaScript 以遊玩。</p></noscript>
</body>
</html>
